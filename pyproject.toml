[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp"
version = "0.1.0"
description = "Minimum video editor REPL: sexpistol s-expressions over OpenTimelineIO and FFmpeg"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["opentimelineio>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sp = "sp.repl.loop:main"

[tool.setuptools.packages.find]
include = ["sp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
